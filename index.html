<h1>Multi Gmail Local</h1>
<p>Multi Gmail Local 是一个本地运行的 Chrome 扩展程序，用于在浏览器工具栏里查看多个 Gmail 账号的未读邮件数量。</p>
<p>该扩展只读取 Gmail 收件箱（INBOX）标签的未读统计数字，不读取邮件正文，不会自动打开任何 Gmail 页面，也不会把数据发送给除 Google 官方 API 以外的任何第三方服务器。</p>
<p>本项目为个人自用工具，未在 Chrome 应用商店上架。</p>
